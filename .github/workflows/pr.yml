name: CI/CD on PR

on:
  # Disabled until the quay repo and the definitions service exist: manual runs
  # only. Restore the original trigger below to enable it.
  workflow_dispatch:
  # pull_request:

jobs:
  pr:
    # Builds the image on every PR (tag: PR head sha). It is pushed to quay only
    # when QUAY_* secrets are available, so fork PRs build without pushing.
    uses: decentraland/platform-actions/.github/workflows/apps-pr.yml@main
    with:
      service-name: asset-optimizer
    secrets: inherit
