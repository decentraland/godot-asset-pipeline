version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: "America/Buenos_Aires"
    allow:
      - dependency-name: "@dcl/*"
      - dependency-name: "@catalyst/*"
      - dependency-name: "@well-known-components/*"
      - dependency-name: "dcl-*"
    versioning-strategy: auto
    commit-message:
      prefix: "chore: "

  # Reusable workflows / actions referenced from .github/workflows.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: "America/Buenos_Aires"
    groups:
      workflow-actions:
        patterns:
          - "*"
    commit-message:
      prefix: chore
