# ElasticMQ (local SQS emulator) configuration for docker-compose.yml.
# Queues are created by init-aws.sh through the SQS API, not here, so the same
# script also works against any other SQS-compatible endpoint.
include classpath("application.conf")

# Queue URLs are returned as http://elasticmq:9324/000000000000/<queue>, which
# resolves from the other compose services. From the host, use
# --endpoint-url http://localhost:9324 (the SDK/CLI then talks to the endpoint
# and only uses the queue URL path).
node-address {
  protocol = http
  host = elasticmq
  port = 9324
  context-path = ""
}

generate-node-address = false

rest-sqs {
  enabled = true
  bind-port = 9324
  bind-hostname = "0.0.0.0"
  # Enforce real SQS limits (e.g. visibility timeout <= 12h).
  sqs-limits = strict
}

# Read-only stats UI at http://localhost:9325
rest-stats {
  enabled = true
  bind-port = 9325
  bind-hostname = "0.0.0.0"
}

aws {
  region = us-east-1
  accountId = 000000000000
}
